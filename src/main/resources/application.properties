# ============================================================
# FarmConnect Backend Configuration
# ============================================================

spring.application.name=farmconnect-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mailpit}
server.port=${PORT:8080}


# ============================================================
# MySQL Database
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/farmconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

# Hibernate automatically detects MySQL.
# Keeping this property is valid, although the startup log
# says it can be removed.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false


# ============================================================
# JWT Authentication
# ============================================================

app.jwt.secret=${JWT_SECRET:}

# Access token = 24 hours
app.jwt.expiration-ms=86400000

# Refresh token = 7 days
app.jwt.refresh-expiration-ms=604800000


# ============================================================
# File Upload
# ============================================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads
# app.upload.base-url was removed: FileStorageServiceImpl now returns a
# relative "/uploads/<filename>" path instead of baking a host into it, so
# there's nothing here to keep in sync with the backend's current IP.


# ============================================================
# Cloudinary Image Storage
# ============================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# ============================================================
# Logging
# ============================================================

logging.level.com.farmconnect=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO


# ============================================================
# Jackson / JSON
# ============================================================

spring.jackson.default-property-inclusion=NON_NULL

spring.jackson.serialization.write-dates-as-timestamps=false


# ============================================================
# Mail / SMTP Shared Configuration
# (Profile-specific SMTP settings in application-mailpit.properties & application-gmail.properties)
# ============================================================

app.mail.sender-name=FarmConnect
app.mail.reset-base-url=${RESET_BASE_URL:http://localhost:8080}
app.reset-password.base-url=${app.mail.reset-base-url}/reset-password
app.reset-password.expiration-minutes=30
