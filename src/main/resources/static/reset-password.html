<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FarmConnect</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #F8F9FA;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: #2E7D32;
            color: #ffffff;
            text-align: center;
            padding: 28px 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .body {
            padding: 32px 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1.5px solid #DDDDDD;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2E7D32;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #777777;
            padding: 4px;
        }

        .toggle-btn:hover {
            color: #2E7D32;
        }

        .helper-text {
            font-size: 12px;
            color: #777777;
            margin-top: 6px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
            display: none;
        }

        .alert-error {
            background-color: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }

        .alert-success {
            background-color: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }

        .btn-submit {
            width: 100%;
            background-color: #2E7D32;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #1B5E20;
        }

        .btn-submit:disabled {
            background-color: #A5D6A7;
            cursor: not-allowed;
        }

        .status-container {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .status-icon {
            font-size: 54px;
            margin-bottom: 16px;
        }

        .status-title {
            font-size: 20px;
            font-weight: 700;
            color: #2E7D32;
            margin-bottom: 8px;
        }

        .status-desc {
            font-size: 14px;
            color: #666666;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: #999999;
            border-top: 1px solid #EEEEEE;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>FarmConnect</h1>
        <p>Direct Farmer-to-Consumer Market</p>
    </div>

    <div class="body">
        <div id="alertBox" class="alert"></div>

        <form id="resetForm">
            <h2 style="font-size: 18px; margin-bottom: 16px; color: #333333;">Create New Password</h2>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter at least 6 characters" required autocomplete="new-password">
                    <button type="button" class="toggle-btn" onclick="toggleVisibility('newPassword', this)">Show</button>
                </div>
                <div class="helper-text">Must be at least 6 characters long</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required autocomplete="new-password">
                    <button type="button" class="toggle-btn" onclick="toggleVisibility('confirmPassword', this)">Show</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Reset Password</button>
        </form>

        <div id="statusContainer" class="status-container">
            <div class="status-icon" id="statusIcon">&#10004;</div>
            <div class="status-title" id="statusTitle">Password Reset Complete</div>
            <div class="status-desc" id="statusDesc">
                Your password has been successfully updated.<br/>
                You can now log in to the FarmConnect mobile app using your new password.
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 FarmConnect. All rights reserved.
    </div>
</div>

<script>
    function extractToken() {
        function cleanToken(t) {
            if (!t) return null;
            let cleaned = t.trim().replace(/[\/\?#].*$/, '');
            cleaned = cleaned.replace(/[\u200B-\u200D\uFEFF]/g, '');
            return cleaned.length > 0 ? cleaned : null;
        }

        // 1. Standard search parameters (?token=...)
        try {
            if (window.location.search) {
                const params = new URLSearchParams(window.location.search);
                for (const [key, value] of params.entries()) {
                    if (key.toLowerCase() === 'token' && value && value.trim() !== '') {
                        return cleanToken(value);
                    }
                }
            }
        } catch (e) {}

        // 2. Hash parameters (#token=... or #?token=...)
        try {
            if (window.location.hash) {
                let h = window.location.hash.replace(/^#\??/, '');
                const hashParams = new URLSearchParams(h);
                for (const [key, value] of hashParams.entries()) {
                    if (key.toLowerCase() === 'token' && value && value.trim() !== '') {
                        return cleanToken(value);
                    }
                }
            }
        } catch (e) {}

        // 3. Fallback: Parse entire window.location.href (handles encoded delimiters %3Ftoken%3D, ?token%3D, etc.)
        try {
            const href = window.location.href;
            const regex = /(?:[?&#]|%3[Ff]|%26)token(?:=|%3[Dd])([^&#\s]+)/i;
            const match = href.match(regex);
            if (match && match[1]) {
                return cleanToken(decodeURIComponent(match[1]));
            }
        } catch (e) {}

        return null;
    }

    const token = extractToken();
    console.log('[FarmConnect] Reset token present:', !!token, 'length:', token ? token.length : 0);

    const alertBox = document.getElementById('alertBox');
    const resetForm = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusContainer = document.getElementById('statusContainer');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');

    function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
        alertBox.style.display = 'block';
    }

    function hideAlert() {
        alertBox.style.display = 'none';
    }

    function toggleVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = 'Hide';
        } else {
            input.type = 'password';
            btn.textContent = 'Show';
        }
    }

    if (!token || token.trim() === '') {
        showAlert('Invalid or missing password reset token. Please use the link sent to your email.');
        document.getElementById('newPassword').disabled = true;
        document.getElementById('confirmPassword').disabled = true;
        submitBtn.disabled = true;
    }

    resetForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        if (!token || token.trim() === '') {
            showAlert('Invalid or missing password reset token.');
            return;
        }

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword.length < 6) {
            showAlert('Password must be at least 6 characters.');
            return;
        }

        if (newPassword !== confirmPassword) {
            showAlert('Passwords do not match. Please verify and try again.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting password...';

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    token: token.trim(),
                    newPassword: newPassword
                })
            });

            const data = await response.json();

            if (response.ok) {
                resetForm.style.display = 'none';
                hideAlert();
                statusContainer.style.display = 'block';
            } else {
                const errorMsg = data.message || 'Failed to reset password. The link may be expired or invalid.';
                showAlert(errorMsg, true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        } catch (err) {
            showAlert('Network error connecting to the server. Please try again later.', true);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });
</script>

</body>
</html>
